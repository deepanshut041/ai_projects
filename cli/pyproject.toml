[project]
name = "ai-home"
version = "0.1.0"
description = "Terminal management for the AI workspace"
requires-python = ">=3.12,<3.13"
dependencies = ["textual==8.2.7"]

[dependency-groups]
dev = ["pytest>=9.0,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
