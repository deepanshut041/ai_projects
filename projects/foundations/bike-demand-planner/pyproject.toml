[project]
name = "bike-demand-planner"
version = "0.1.0"
description = "Hourly bike rental demand estimation and model comparison"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/*.py",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
    "/.gitignore",
]
