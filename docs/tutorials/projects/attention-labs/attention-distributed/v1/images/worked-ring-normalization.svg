<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" role="img"><title>Global normalization preserves unequal block mass</title><desc>Two visible blocks for one query: independent local averages discard the denominator.</desc>
<rect x="0" y="0" width="1160" height="700" rx="0" fill="#f8f8fd"/>
<rect x="0" y="0" width="1160" height="8" rx="0" fill="#6846c7"/>
<text x="36" y="48" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17253f">Global normalization preserves unequal block mass</text>
<text x="36" y="81" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#53617b">Two visible blocks for one query: independent local averages discard the denominator.</text>
<rect x="36" y="120" width="515" height="184" rx="12" fill="#ffffff" stroke="#d9deec" stroke-width="1.5"/>
<text x="54" y="152" font-family="DejaVu Sans" font-size="21" font-weight="700" text-anchor="start" fill="#2563b9">Block A</text>
<text x="56" y="191" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#17253f">logits [0,0], values [0,0]</text>
<text x="56" y="222" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#17253f">mA=0, lA=2, uA=0</text>
<text x="56" y="253" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#17253f">local output = 0</text>
<rect x="609" y="120" width="515" height="184" rx="12" fill="#ffffff" stroke="#d9deec" stroke-width="1.5"/>
<text x="627" y="152" font-family="DejaVu Sans" font-size="21" font-weight="700" text-anchor="start" fill="#16735e">Block B</text>
<text x="629" y="191" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#17253f">logits [5,5], values [10,10]</text>
<text x="629" y="222" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#17253f">mB=5, lB=2, uB=20</text>
<text x="629" y="253" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#17253f">local output = 10</text>
<text x="36" y="356" font-family="DejaVu Sans" font-size="23" font-weight="700" text-anchor="start" fill="#6846c7">Merge at common max 5:  l = 2 exp(−5) + 2 = 2.013476;  u = 20</text>
<text x="36" y="425" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="start" fill="#2563b9">A mass</text>
<rect x="200" y="396" width="620" height="37" rx="4" fill="#e9edf6"/>
<rect x="200" y="396" width="4.14956757305661" height="37" rx="4" fill="#2563b9"/>
<text x="850" y="425" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#2563b9">0.006693</text>
<text x="36" y="503" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="start" fill="#16735e">B mass</text>
<rect x="200" y="474" width="620" height="37" rx="4" fill="#e9edf6"/>
<rect x="200" y="474" width="615.8504324269434" height="37" rx="4" fill="#16735e"/>
<text x="850" y="503" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#16735e">0.993307</text>
<rect x="36" y="563" width="515" height="91" rx="12" fill="#e5f4ee"/>
<text x="56" y="617" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="start" fill="#16735e">Global y = 20 / 2.013476 ≈ 9.933071</text>
<rect x="609" y="563" width="515" height="91" rx="12" fill="#fbe9ed"/>
<text x="629" y="617" font-family="DejaVu Sans" font-size="22" font-weight="700" text-anchor="start" fill="#b13f56">Equal average (0+10)/2 = 5 is wrong</text>
</svg>