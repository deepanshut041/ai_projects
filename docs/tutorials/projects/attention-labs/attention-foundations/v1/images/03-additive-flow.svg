<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-label="A query-dependent context from retained states">
<title>A query-dependent context from retained states</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#376b66" /></marker></defs>
<rect width="920" height="440" rx="12" fill="#f8fbfa" />
<text x="30" y="45" font-family="Arial,sans-serif" fill="#173d3b" font-size="27" font-weight="bold">A query-dependent context from retained states</text><rect x="30" y="105" width="220" height="85" rx="8" fill="#e1f2ec" stroke="#4f8a7d" stroke-width="2" /><text x="46" y="139" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">Query + memory</text><text x="46" y="169" font-family="Arial,sans-serif" fill="#173d3b" font-size="18">s and source rows hⱼ</text><path d="M255 147L315 147" stroke="#376b66" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="320" y="105" width="250" height="85" rx="8" fill="#e1f2ec" stroke="#4f8a7d" stroke-width="2" /><text x="336" y="139" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">Compatibility</text><text x="336" y="169" font-family="Arial,sans-serif" fill="#173d3b" font-size="18">uᵀ tanh(Wₛs + Wₕhⱼ)</text><path d="M575 147L645 147" stroke="#376b66" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="650" y="105" width="240" height="85" rx="8" fill="#e1f2ec" stroke="#4f8a7d" stroke-width="2" /><text x="666" y="139" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">Normalize</text><text x="666" y="169" font-family="Arial,sans-serif" fill="#173d3b" font-size="18">one weight per source</text><rect x="320" y="270" width="300" height="85" rx="8" fill="#e1f2ec" stroke="#4f8a7d" stroke-width="2" /><text x="336" y="304" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">Return a context</text><text x="336" y="334" font-family="Arial,sans-serif" fill="#173d3b" font-size="18">c = Σⱼ αⱼ hⱼ</text><path d="M770 195V305H628" stroke="#376b66" stroke-width="3" fill="none" marker-end="url(#arrow)" /><text x="40" y="405" font-family="Arial,sans-serif" fill="#173d3b" font-size="18">Memory stays fixed while the query changes the weights and context.</text></svg>