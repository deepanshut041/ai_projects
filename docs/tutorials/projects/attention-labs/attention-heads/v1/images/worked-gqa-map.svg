<text x="36" y="475" font-family="DejaVu Sans" font-size="23" font-weight="700" text-anchor="start" fill="#16735e">Correct contiguous expansion:  [0, 0, 0, 0, 1, 1, 1, 1]</text>
<text x="36" y="520" font-family="DejaVu Sans" font-size="20" font-weight="400" text-anchor="start" fill="#b13f56">Alternating [0, 1, 0, 1, 0, 1, 0, 1] has the same shape but different connections.</text>
<text x="36" y="557" font-family="DejaVu Sans" font-size="20" font-weight="400" text-anchor="start" fill="#17253f">g(h) = floor(h / 4); outputs are still joined in query-head order 0 through 7.</text>
