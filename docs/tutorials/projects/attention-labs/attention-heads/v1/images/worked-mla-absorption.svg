<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img"><title>Move a linear map without changing the score row</title><desc>C rows = [1,0], [0,1], [1,1]; q = [1,1]; UK rows = [1,2], [0,1].</desc>
<rect x="0" y="0" width="1160" height="650" rx="0" fill="#f8f8fd"/>
<rect x="0" y="0" width="1160" height="8" rx="0" fill="#6846c7"/>
<text x="36" y="48" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17253f">Move a linear map without changing the score row</text>
<text x="36" y="81" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#53617b">C rows = [1,0], [0,1], [1,1]; q = [1,1]; UK rows = [1,2], [0,1].</text>
<rect x="36" y="118" width="515" height="330" rx="12" fill="#ffffff" stroke="#d9deec" stroke-width="1.5"/>
<text x="54" y="150" font-family="DejaVu Sans" font-size="21" font-weight="700" text-anchor="start" fill="#2563b9">Expand the historical keys</text>
<text x="56" y="199" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#17253f">C UK = [[1,2], [0,1], [1,3]]</text>
<text x="56" y="230" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#17253f">q · each key → [3, 1, 4]</text>
<line x1="294" y1="259" x2="294" y2="305" stroke="#2563b9" stroke-width="2.5"/>
<polygon points="294.00,305.00 289.72,294.87 298.28,294.87" fill="#2563b9"/>
<text x="56" y="355" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#17253f">three raw scores; scale by √2</text>
<text x="56" y="386" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#17253f">then normalize across tokens</text>
<rect x="609" y="118" width="515" height="330" rx="12" fill="#ffffff" stroke="#d9deec" stroke-width="1.5"/>
<text x="627" y="150" font-family="DejaVu Sans" font-size="21" font-weight="700" text-anchor="start" fill="#16735e">Transform the current query</text>
<text x="629" y="199" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#17253f">q UKᵀ = [3, 1]</text>
<text x="629" y="230" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#17253f">[3,1] · each C row → [3, 1, 4]</text>
<line x1="867" y1="259" x2="867" y2="305" stroke="#16735e" stroke-width="2.5"/>
<polygon points="867.00,305.00 862.72,294.87 871.28,294.87" fill="#16735e"/>
<text x="629" y="355" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#17253f">the same three scaled scores</text>
<text x="629" y="386" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#17253f">therefore the same weights a</text>
<rect x="36" y="481" width="1088" height="126" rx="12" fill="#ede8fb"/>
<text x="56" y="525" font-family="DejaVu Sans" font-size="24" font-weight="400" text-anchor="start" fill="#17253f">Value path: a C = [a₀ + a₂, a₁ + a₂]</text>
<text x="56" y="556" font-family="DejaVu Sans" font-size="24" font-weight="400" text-anchor="start" fill="#17253f">With UV = diag(2,3):  (a C) UV = [2(a₀ + a₂), 3(a₁ + a₂)]</text>
</svg>