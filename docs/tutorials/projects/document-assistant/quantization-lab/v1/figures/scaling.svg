<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title description"><title id="title">Exact float transform; different quantized errors</title><desc id="description">Scaling weights and inversely scaling input preserves the floating output, but affects quantization grid loss.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#486687"/></marker></defs><rect width="900" height="410" fill="#f8fbff"/><g font-family="sans-serif"><text x="28" y="42" font-size="27" fill="#18263c">Exact float transform; different quantized errors</text><rect x="30" y="95" width="400" height="110" rx="12" fill="#e4efff" stroke="#7892b5"/><text x="46" y="129" font-size="21" fill="#18263c">Original: w=[0.24,1.02]</text><text x="46" y="160" font-size="18" fill="#18263c">x=[4,1] → output 1.98</text><rect x="470" y="95" width="400" height="110" rx="12" fill="#e4efff" stroke="#7892b5"/><text x="486" y="129" font-size="21" fill="#18263c">Scale [4,1]: w=[0.96,1.02]</text><text x="486" y="160" font-size="18" fill="#18263c">x=[1,1] → output 1.98</text><text x="35" y="275" font-size="22" fill="#18263c">Ternary reconstruction, two calibration inputs:</text><text x="35" y="320" font-size="22" fill="#18263c">Scale 1 → MSE 0.9216; scale 4 → MSE 0.0036</text><text x="35" y="365" font-size="21" fill="#18263c">Scale 8 → MSE 0.81. Larger scaling can harm other channels.</text></g></svg>