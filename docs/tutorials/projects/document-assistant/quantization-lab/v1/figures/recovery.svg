<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title description"><title id="title">Choose a verified generation, disclose fallback</title><desc id="description">A loader ignores an incomplete staging directory, rejects a corrupt newest generation and loads the older verified one.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#486687"/></marker></defs><rect width="900" height="420" fill="#f8fbff"/><g font-family="sans-serif"><text x="28" y="42" font-size="27" fill="#18263c">Choose a verified generation, disclose fallback</text><rect x="30" y="90" width="840" height="80" rx="12" fill="#e4efff" stroke="#7892b5"/><text x="46" y="124" font-size="21" fill="#18263c">gen-0003.partial — ignore</text><text x="46" y="155" font-size="18" fill="#18263c">Not published</text><rect x="30" y="195" width="840" height="80" rx="12" fill="#ffe7df" stroke="#7892b5"/><text x="46" y="229" font-size="21" fill="#18263c">gen-0002 — reject</text><text x="46" y="260" font-size="18" fill="#18263c">Saved bytes fail size/hash check</text><rect x="30" y="300" width="840" height="80" rx="12" fill="#e0f5e9" stroke="#7892b5"/><text x="46" y="334" font-size="21" fill="#18263c">gen-0001 — load and record fallback</text><text x="46" y="365" font-size="18" fill="#18263c">Complete manifest and bytes verified</text></g></svg>