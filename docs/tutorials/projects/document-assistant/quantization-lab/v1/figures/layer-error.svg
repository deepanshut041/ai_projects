<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title description"><title id="title">The input determines which weight errors matter</title><desc id="description">The reconstructed weight error matrix times the input gives output errors minus 0.98 and minus 0.95.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#486687"/></marker></defs><rect width="900" height="410" fill="#f8fbff"/><g font-family="sans-serif"><text x="28" y="42" font-size="27" fill="#18263c">The input determines which weight errors matter</text><rect x="30" y="95" width="300" height="110" rx="12" fill="#e4efff" stroke="#7892b5"/><text x="46" y="129" font-size="21" fill="#18263c">Weight error E</text><text x="46" y="160" font-size="18" fill="#18263c">[−0.24, −0.02]</text><text x="46" y="184" font-size="18" fill="#18263c">[−0.24, +0.01]</text><text x="350" y="160" font-size="32" fill="#18263c">×</text><rect x="390" y="95" width="170" height="110" rx="12" fill="#e4efff" stroke="#7892b5"/><text x="406" y="129" font-size="21" fill="#18263c">x</text><text x="406" y="160" font-size="18" fill="#18263c">[4, 1]</text><text x="580" y="160" font-size="32" fill="#18263c">=</text><rect x="630" y="95" width="235" height="110" rx="12" fill="#ffe7df" stroke="#7892b5"/><text x="646" y="129" font-size="21" fill="#18263c">Output error</text><text x="646" y="160" font-size="18" fill="#18263c">[−0.98, −0.95]</text><text x="35" y="270" font-size="23" fill="#18263c">Row 1: (−0.24 × 4) + (−0.02 × 1) = −0.98</text><text x="35" y="320" font-size="23" fill="#18263c">Row 2: (−0.24 × 4) + ( 0.01 × 1) = −0.95</text><text x="35" y="375" font-size="21" fill="#18263c">The same weight error has a larger effect on a larger input.</text></g></svg>