<svg xmlns="http://www.w3.org/2000/svg" width="570" height="335" role="img" aria-labelledby="title" viewBox="0 0 570 335"><title id="title">Integer IDs select floating-point rows</title><desc>For the declared character vocabulary, cat→[3,2,5]. Lookup preserves three positions and changes each ID into two features.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="125.0" y1="121.0" x2="125.0" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="304.2" y1="121.0" x2="185.8" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>Three integer vocabulary references.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">IDs [3,2,5]</tspan></text></g><g><title>Two learned features per row.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">E table [6,2]</tspan></text></g><g><title>Rows3,2,5 are retrieved in order.</title><rect x="30" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="238.0">E[IDs] shape [3,2]</tspan></text></g></svg>
