<svg xmlns="http://www.w3.org/2000/svg" width="810" height="185" role="img" aria-labelledby="title" viewBox="0 0 810 185"><title id="title">Separate three kinds of model state</title><desc>Parameters are adjusted by gradients; persistent buffers store nonparameter tensors; training/evaluation mode chooses behavior and is not a tensor weight.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><g><title>Weights/biases learned by optimizer.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">parameters</tspan></text></g><g><title>Registered nonparameter tensor state.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">buffers</tspan></text></g><g><title>Dropout and other mode-dependent behavior.</title><rect x="510" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="605.0" y="88.0">train/eval mode</tspan></text></g></svg>
