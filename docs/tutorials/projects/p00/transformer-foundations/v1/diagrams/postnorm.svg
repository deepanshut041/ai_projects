<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="185" role="img" aria-labelledby="title" viewBox="0 0 1290 185"><title id="title">Post-norm sublayer order</title><desc>Each add retains the sublayer input as a residual; normalization follows the addition. The decoder inserts cross-attention and a third add/norm between self-attention and FFN.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">context</text><line x1="460.0" y1="83.0" x2="510.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="485.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">residual</text><line x1="700.0" y1="83.0" x2="750.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="725.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">transform</text><line x1="940.0" y1="83.0" x2="990.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="965.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">residual</text><g><title>Residual branch retained</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">Input X [B, T, D]</tspan></text></g><g><title>Returns width D</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">Attention(X)</tspan></text></g><g><title>Normalization after residual sum</title><rect x="510" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="605.0" y="88.0">Add X; then LN1</tspan></text></g><g><title>D → F → D at each position</title><rect x="750" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="845.0" y="88.0">ReLU FFN</tspan></text></g><g><title>Preserve post-norm order</title><rect x="990" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="1085.0" y="88.0">Add U; then LN2</tspan></text></g></svg>
