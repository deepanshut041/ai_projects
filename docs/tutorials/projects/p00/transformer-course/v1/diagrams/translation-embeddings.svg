<svg xmlns="http://www.w3.org/2000/svg" width="570" height="335" role="img" aria-labelledby="title" viewBox="0 0 570 335"><title id="title">Separate symbol and classifier tables</title><desc>Separate source and target symbols meet through the encoder–decoder; a separate head classifies the target vocabulary.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="125.0" y1="121.0" x2="125.0" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="210.0" y="158.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">encoder memory</text><line x1="304.2" y1="121.0" x2="185.8" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">target prefix</text><line x1="220.0" y1="233.0" x2="270.0" y2="233.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="183.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">project logits</text><g><title>Source tokenizer owns rows; encoding produces source memory.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">Source IDs → Esrc</tspan></text></g><g><title>Target tokenizer owns rows; the shifted target supplies decoder input.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">Target IDs → Etgt</tspan></text></g><g><title>Causal target processing retrieves source memory.</title><rect x="30" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="238.0">Decoder hidden state</tspan></text></g><g><title>Independent biased projection scores all target symbols.</title><rect x="270" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="229.0">Target vocabulary</tspan><tspan x="365.0" y="247.0">head</tspan></text></g></svg>
