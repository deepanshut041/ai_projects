<svg xmlns="http://www.w3.org/2000/svg" width="570" height="335" role="img" aria-labelledby="title" viewBox="0 0 570 335"><title id="title">One character answer may fit only some windows</title><desc>Use [start,end) character offsets. A window has a supervised answer only if it contains the entire span. Overlapping partial windows use ignored labels; they are not impossible-question examples.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">partial</text><line x1="125.0" y1="121.0" x2="125.0" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="210.0" y="158.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">complete</text><line x1="220.0" y1="233.0" x2="270.0" y2="233.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>Offsets refer to original context characters.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">original answer [a,b)</tspan></text></g><g><title>May contain only part of the answer.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">question + window 1</tspan></text></g><g><title>Contains the full answer span.</title><rect x="30" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="238.0">question + window 2</tspan></text></g><g><title>Context token offsets contain the boundaries.</title><rect x="270" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="229.0">full span → token</tspan><tspan x="365.0" y="247.0">labels</tspan></text></g></svg>
