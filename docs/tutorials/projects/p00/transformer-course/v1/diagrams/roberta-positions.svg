<svg xmlns="http://www.w3.org/2000/svg" width="810" height="185" role="img" aria-labelledby="title" viewBox="0 0 810 185"><title id="title">Padding-aware learned positions</title><desc>With PAD=1, IDs [0,7,2,1,1] map to positions [2,3,4,1,1]. Left padding does not shift the real-token position count.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="460.0" y1="83.0" x2="510.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>BOS, ordinary token, EOS, PAD, PAD.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">IDs [0,7,2,1,1]</tspan></text></g><g><title>Count only non-PAD positions.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">real [1,1,1,0,0]</tspan></text></g><g><title>Real cumulative count plus padding index.</title><rect x="510" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="605.0" y="88.0">positions [2,3,4,1,1]</tspan></text></g></svg>
