<svg xmlns="http://www.w3.org/2000/svg" width="810" height="185" role="img" aria-labelledby="title" viewBox="0 0 810 185"><title id="title">One query retrieves a mixture</title><desc>A [1,3] assigns one weight per source row. Multiplying V [3,2] reduces the source axis and retains two feature coordinates.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="460.0" y1="83.0" x2="510.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>Weights sum to one and act on both feature columns.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">A = [.25,.25,.5]</tspan></text></g><g><title>Three positions store two features each.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="79.0">V rows: [2,0] [0,3]</tspan><tspan x="365.0" y="97.0">[4,5]</tspan></text></g><g><title>Feature 0: .5+0+2; feature 1: 0+.75+2.5.</title><rect x="510" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="605.0" y="88.0">A @ V = [2.5,3.25]</tspan></text></g></svg>
