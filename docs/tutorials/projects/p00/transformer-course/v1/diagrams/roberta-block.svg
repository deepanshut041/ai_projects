<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="185" role="img" aria-labelledby="title" viewBox="0 0 1290 185"><title id="title">A bidirectional representation reaches a tied head</title><desc>Post-norm attention and FFN blocks retain [B,T,D]. The MLM transform returns width D, then the input embedding table projects to the vocabulary.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="460.0" y1="83.0" x2="510.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="700.0" y1="83.0" x2="750.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="940.0" y1="83.0" x2="990.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>Embedding normalization and dropout.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="79.0">token + learned</tspan><tspan x="125.0" y="97.0">position</tspan></text></g><g><title>All real keys visible.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="79.0">attention + residual</tspan><tspan x="365.0" y="97.0">+ LN</tspan></text></g><g><title>Shared nonlinear map at each position.</title><rect x="510" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="605.0" y="79.0">GELU FFN + residual +</tspan><tspan x="605.0" y="97.0">LN</tspan></text></g><g><title>Task transform keeps feature width D.</title><rect x="750" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="845.0" y="88.0">MLM dense → GELU → LN</tspan></text></g><g><title>One parameter table serves lookup and decoder.</title><rect x="990" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="1085.0" y="88.0">tied Eᵀ → [B,T,V]</tspan></text></g></svg>
