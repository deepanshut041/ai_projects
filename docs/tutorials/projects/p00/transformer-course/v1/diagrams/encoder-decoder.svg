<svg xmlns="http://www.w3.org/2000/svg" width="570" height="485" role="img" aria-labelledby="title" viewBox="0 0 570 485"><title id="title">The decoder uses two information sources</title><desc>Source representations feed cross-attention as K/V; the evolving target representation supplies Q. Target self-attention remains causal.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="125.0" y1="121.0" x2="125.0" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="365.0" y1="121.0" x2="365.0" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="125.0" y1="271.0" x2="125.0" y2="345.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="304.2" y1="271.0" x2="185.8" y2="345.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="220.0" y1="383.0" x2="270.0" y2="383.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>Separate source embedding table.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="79.0">source IDs +</tspan><tspan x="125.0" y="97.0">positions</tspan></text></g><g><title>Shifted prefix uses its own embedding table.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="79.0">target IDs +</tspan><tspan x="365.0" y="97.0">positions</tspan></text></g><g><title>All real source tokens interact.</title><rect x="30" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="229.0">encoder → memory</tspan><tspan x="125.0" y="247.0">[B,S,D]</tspan></text></g><g><title>Target self-attention sees no future token.</title><rect x="270" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="238.0">causal decoder state</tspan></text></g><g><title>Retrieval connects target and source axes.</title><rect x="30" y="345" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="379.0">cross: target Q,</tspan><tspan x="125.0" y="397.0">memory K/V</tspan></text></g><g><title>Predict one next French ID per target position.</title><rect x="270" y="345" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="388.0">FFN → logits [B,T,Vt]</tspan></text></g></svg>
