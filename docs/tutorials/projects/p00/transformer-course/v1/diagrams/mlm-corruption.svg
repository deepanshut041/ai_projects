<svg xmlns="http://www.w3.org/2000/svg" width="620" height="375" role="img" aria-labelledby="title" viewBox="0 0 620 375"><title id="title">Selection creates labels; branches alter inputs</title><desc>Select 15% of eligible ordinary real tokens and retain their original IDs. The figure branches after selection: exactly one corruption choice applies to each selected token; branches do not run sequentially.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="159.29032258064515" x2="340.0" y2="116.70967741935485" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="220.0" y1="193.0" x2="340.0" y2="193.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="220.0" y1="226.70967741935485" x2="340.0" y2="269.2903225806452" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>Unselected targets are −100.</title><rect x="30" y="155" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="189.0">select → original</tspan><tspan x="125.0" y="207.0">labels</tspan></text></g><g><title>Predict the hidden original ID.</title><rect x="340" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="435.0" y="88.0">80% MASK input</tspan></text></g><g><title>Replacement may equal original; label is unchanged.</title><rect x="340" y="155" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="435.0" y="198.0">10% random input</tspan></text></g><g><title>Still a selected supervised target.</title><rect x="340" y="265" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="435.0" y="308.0">10% unchanged input</tspan></text></g></svg>
