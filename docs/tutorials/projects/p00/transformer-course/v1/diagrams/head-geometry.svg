<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="185" role="img" aria-labelledby="title" viewBox="0 0 1290 185"><title id="title">Split features, preserve positions</title><desc>Example B=1,T=2,D=8,H=2,d=4: each token keeps eight coordinates, divided into two learned head subspaces. Merge in the inverse order.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="460.0" y1="83.0" x2="510.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="700.0" y1="83.0" x2="750.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="940.0" y1="83.0" x2="990.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>Projected total feature width.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">Q [1,2,8]</tspan></text></g><g><title>Axes B,T,H,d.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="79.0">reshape B,T,H,d</tspan><tspan x="365.0" y="97.0">[1,2,2,4]</tspan></text></g><g><title>Axes B,H,T,d; same sizes here, different meaning.</title><rect x="510" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="605.0" y="79.0">transpose B,H,T,d</tspan><tspan x="605.0" y="97.0">[1,2,2,4]</tspan></text></g><g><title>Independent key normalization per head/query.</title><rect x="750" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="845.0" y="79.0">head contexts</tspan><tspan x="845.0" y="97.0">[1,2,2,4]</tspan></text></g><g><title>Transpose back before flattening H,d.</title><rect x="990" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="1085.0" y="88.0">merge [1,2,8] → Wo</tspan></text></g></svg>
