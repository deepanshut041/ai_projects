ont-size="18" text-anchor="middle">block</text><rect x="457" y="270" width="70" height="52" rx="5" fill="#4c2938"/><text x="492" y="304" fill="#ffa3a3" font-size="18" text-anchor="middle">block</text><text x="98" y="369" fill="#e8eef7" font-size="21" text-anchor="middle">2: lisons</text><rect x="232" y="332" width="70" height="52" rx="5" fill="#244c46"/><text x="267" y="366" fill="#84e2be" font-size="18" text-anchor="middle">read</text><rect x="307" y="332" width="70" height="52" rx="5" fill="#244c46"/><text x="342" y="366" fill="#84e2be" font-size="18" text-anchor="middle">read</text><rect x="382" y="332" width="70" height="52" rx="5" fill="#244c46"/><text x="417" y="366" fill="#84e2be" font-size="18" text-anchor="middle">read</text><rect x="457" y="332" width="70" height="52" rx="5" fill="#4c2938"/><text x="492" y="366" fill="#ffa3a3" font-size="18" text-anchor="middle">block</text><text x="98" y="431" fill="#e8eef7" font-size="21" text-anchor="middle">3: des</text><rect x="232" y="394" width="70" height="52" rx="5" fill="#244c46"/><text x="267" y="428" fill="#84e2be" font-size="18" text-anchor="middle">read</text><rect x="307" y="394" width="70" height="52" rx="5" fill="#244c46"/><text x="342" y="428" fill="#84e2be" font-size="18" text-anchor="middle">read</text><rect x="382" y="394" width="70" height="52" rx="5" fill="#244c46"/><text x="417" y="428" fill="#84e2be" font-size="18" text-anchor="middle">read</text><rect x="457" y="394" width="70" height="52" rx="5" fill="#244c46"/><text x="492" y="428" fill="#84e2be" font-size="18" text-anchor="middle">read</text><text x="280" y="510" fill="#e8eef7" font-size="22" text-anchor="middle">Row 1 must predict “lisons”.</text><text x="280" y="544" fill="#ffa3a3" font-size="20" text-anchor="middle">Reading input key 2 would reveal that label.</text><text x="280" y="582" fill="#e8eef7" font-size="21" text-anchor="middle">Allow j ≤ i; shift the labels separately.</text></g></svg>