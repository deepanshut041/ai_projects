<svg xmlns="http://www.w3.org/2000/svg" width="560" height="710" viewBox="0 0 560 710" role="img" aria-labelledby="title">
<title id="title">Translation loss supplies gradients through vocabulary decoder and attention paths while the local probe isolates retrieval</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7cc8ff"/></marker></defs>
<rect width="560" height="710" rx="12" fill="#101c2c"/>
<g font-family="DejaVu Sans, sans-serif"><text x="280" y="32" fill="#e8eef7" font-size="23" text-anchor="middle">Full-model learning path</text><rect x="40" y="58" width="480" height="80" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="280.0" y="105.0" fill="#7cc8ff" font-size="21" text-anchor="middle">Q/K/V parameters → gathered context C</text><path d="M280,138 L280,166" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="170" width="480" height="80" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="280.0" y="217.0" fill="#7cc8ff" font-size="21" text-anchor="middle">Decoder computation → h_t</text><path d="M280,250 L280,278" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="282" width="480" height="80" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="280.0" y="329.0" fill="#7cc8ff" font-size="21" text-anchor="middle">Vocabulary projection → logits z_t</text><path d="M280,362 L280,390" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="394" width="480" height="80" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="280.0" y="441.0" fill="#7cc8ff" font-size="21" text-anchor="middle">Softmax → next-token distribution p_t</text><path d="M280,474 L280,502" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="506" width="480" height="80" rx="9" fill="#18273b" stroke="#84e2be" stroke-width="2"/><text x="280.0" y="539.0" fill="#84e2be" font-size="21" text-anchor="middle">Reference token: lisons</text><text x="280.0" y="567.0" fill="#e8eef7" font-size="21" text-anchor="middle">Loss = −log p_t[lisons]</text><path d="M40,546 L15,546 L15,98 L40,98" fill="none" stroke="#ffa3a3" stroke-width="3" marker-end="url(#arrow)"/><text x="280" y="647" fill="#ffa3a3" font-size="20" text-anchor="middle">Backward: task error changes shared parameters.</text><text x="280" y="683" fill="#e8eef7" font-size="20" text-anchor="middle">Local probe isolates C → squared error only.</text></g></svg>