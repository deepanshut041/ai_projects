<svg xmlns="http://www.w3.org/2000/svg" width="570" height="335" role="img" aria-labelledby="title" viewBox="0 0 570 335"><title id="title">Carry tested contracts into a new objective</title><desc>Course 2 is a decoder-only autoregressive model. Tokenizer/split/mask/loss/recovery reasoning transfers; encoder weights do not automatically become a GPT checkpoint.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="125.0" y1="121.0" x2="125.0" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="304.2" y1="121.0" x2="185.8" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="220.0" y1="233.0" x2="270.0" y2="233.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>Causal decoder and source cross-attention.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="79.0">translation: source +</tspan><tspan x="125.0" y="97.0">prefix</tspan></text></g><g><title>MLM and extractive endpoint heads.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="79.0">RoBERTa:</tspan><tspan x="365.0" y="97.0">bidirectional input</tspan></text></g><g><title>Axes, gradients, tokens, counts and recovery.</title><rect x="30" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="229.0">shared tested</tspan><tspan x="125.0" y="247.0">contracts</tspan></text></g><g><title>One tokenizer; learned positions; pre-norm.</title><rect x="270" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="229.0">GPT: prefix → next</tspan><tspan x="365.0" y="247.0">token</tspan></text></g></svg>
