<svg xmlns="http://www.w3.org/2000/svg" width="570" height="335" role="img" aria-labelledby="title" viewBox="0 0 570 335"><title id="title">Generation extends its own prefix</title><desc>Encode the source once. Recompute target-prefix states, use the last query logits, append one chosen ID, and track EOS separately for every row.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="125.0" y1="121.0" x2="125.0" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="304.2" y1="121.0" x2="185.8" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="220.0" y1="233.0" x2="270.0" y2="233.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="365.0" y1="195.0" x2="365.0" y2="121.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="450.0" y="158.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">unfinished</text><g><title>Gold target labels are absent.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="79.0">source → encoder</tspan><tspan x="125.0" y="97.0">memory</tspan></text></g><g><title>Causal target context only.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="79.0">BOS + generated</tspan><tspan x="365.0" y="97.0">prefix</tspan></text></g><g><title>Greedy choice is local, not sequence optimum.</title><rect x="30" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="238.0">last logits → next ID</tspan></text></g><g><title>Finished rows remain finished.</title><rect x="270" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="238.0">EOS or length bound</tspan></text></g></svg>
