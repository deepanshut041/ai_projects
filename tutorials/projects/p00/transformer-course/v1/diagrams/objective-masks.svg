<svg xmlns="http://www.w3.org/2000/svg" width="810" height="185" role="img" aria-labelledby="title" viewBox="0 0 810 185"><title id="title">The objective chooses visibility</title><desc>Translation has three visibility patterns. MLM reads both directions at real positions; GPT permits only a prefix. Loss masks select supervision separately.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><g><title>Square [S,S] key visibility.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="79.0">source encoder: all</tspan><tspan x="125.0" y="97.0">real keys</tspan></text></g><g><title>Square [T,T] lower triangle intersected with padding.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="79.0">target decoder:</tspan><tspan x="365.0" y="97.0">causal keys</tspan></text></g><g><title>Rectangular [T,S], queries remain target positions.</title><rect x="510" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="605.0" y="79.0">cross-attention:</tspan><tspan x="605.0" y="97.0">source keys</tspan></text></g></svg>
