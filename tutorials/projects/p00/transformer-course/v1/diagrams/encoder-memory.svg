<svg xmlns="http://www.w3.org/2000/svg" width="810" height="185" role="img" aria-labelledby="title" viewBox="0 0 810 185"><title id="title">Encoder stack retains source coordinates</title><desc>Read alongside the worked calculation and explicit implementation boundaries in its lesson.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">contract</text><line x1="460.0" y1="83.0" x2="510.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="485.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">contract</text><g><title>Separate source embedding and fixed position buffer</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">Source + positions</tspan></text></g><g><title>Full-source self-attention, FFN, two post-norm residuals per layer</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">Independent layers</tspan></text></g><g><title>Persistent source-valid mask accompanies contextual memory</title><rect x="510" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="605.0" y="88.0">Memory [B,S,D]</tspan></text></g></svg>
