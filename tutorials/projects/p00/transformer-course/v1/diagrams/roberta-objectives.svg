<svg xmlns="http://www.w3.org/2000/svg" width="620" height="265" role="img" aria-labelledby="title" viewBox="0 0 620 265"><title id="title">One encoder, two supervision rules</title><desc>MLM predicts original IDs only at selected locations. QA reuses encoder representations to locate an answer in a supplied context; it does not generate arbitrary text.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="121.14516129032258" x2="340.0" y2="99.85483870967742" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="220.0" y1="154.8548387096774" x2="340.0" y2="176.1451612903226" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>Every query may read all real keys.</title><rect x="30" y="100" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="143.0">bidirectional encoder</tspan></text></g><g><title>Selected original token labels.</title><rect x="340" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="435.0" y="79.0">MLM pretraining:</tspan><tspan x="435.0" y="97.0">vocabulary logits</tspan></text></g><g><title>Context start and end token labels.</title><rect x="340" y="155" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="435.0" y="189.0">QA fine-tuning:</tspan><tspan x="435.0" y="207.0">endpoint logits</tspan></text></g></svg>
