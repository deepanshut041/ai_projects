<svg xmlns="http://www.w3.org/2000/svg" width="570" height="335" role="img" aria-labelledby="title" viewBox="0 0 570 335"><title id="title">Position features are added to token features</title><desc>At position 0, sine coordinates are 0 and cosine coordinates 1. Different frequencies change with position; token identity and order remain separate inputs.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="125.0" y1="121.0" x2="125.0" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="304.2" y1="121.0" x2="185.8" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>Learned lookup; same token reuses its row.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">token embedding [T,D]</tspan></text></g><g><title>Fixed sin/cos frequencies; a model buffer.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="79.0">position features</tspan><tspan x="365.0" y="97.0">[T,D]</tspan></text></g><g><title>A representation contains content and order.</title><rect x="30" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="238.0">sum → block input</tspan></text></g></svg>
