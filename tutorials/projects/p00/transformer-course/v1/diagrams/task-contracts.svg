<svg xmlns="http://www.w3.org/2000/svg" width="570" height="335" role="img" aria-labelledby="title" viewBox="0 0 570 335"><title id="title">Three task contracts</title><desc>Compare three distinct input, visibility, target and inference contracts.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><g><title>Causal target likelihood over vocabulary IDs</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">Source + prefix</tspan></text></g><g><title>Bidirectional MLM over selected original IDs</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">Corrupted sentence</tspan></text></g><g><title>Packed endpoint loss and constrained context span</title><rect x="30" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="238.0">Question + context</tspan></text></g></svg>
