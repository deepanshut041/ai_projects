<svg xmlns="http://www.w3.org/2000/svg" width="570" height="485" role="img" aria-labelledby="title" viewBox="0 0 570 485"><title id="title">Q and K choose; V supplies the payload</title><desc>Three learned affine maps retain the token axis. Q [T,d] times Kᵀ [d,S] creates comparisons; row-softmax weights mix V [S,d].</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="125.0" y1="121.0" x2="125.0" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="304.2" y1="121.0" x2="185.8" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="125.0" y1="271.0" x2="125.0" y2="345.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="304.2" y1="271.0" x2="185.8" y2="345.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>A query row asks for information.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">X @ Wq → Q [T,d]</tspan></text></g><g><title>A key row provides an address to compare.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">Y @ Wk → K [S,d]</tspan></text></g><g><title>One allowed-key distribution per query.</title><rect x="30" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="238.0">softmax(QKᵀ/√d)</tspan></text></g><g><title>Values provide information rather than scores.</title><rect x="270" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="238.0">Y @ Wv → V [S,d]</tspan></text></g><g><title>The S axis is reduced; target queries remain.</title><rect x="30" y="345" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="388.0">A @ V → C [T,d]</tspan></text></g></svg>
