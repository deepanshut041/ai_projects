<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="185" role="img" aria-labelledby="title" viewBox="0 0 1530 185"><title id="title">One optimizer update: preserve the chain</title><desc>Forward dependencies create a graph; backward computes gradients; the optimizer changes persistent parameters. A save boundary follows the complete update.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">compute</text><line x1="460.0" y1="83.0" x2="510.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="485.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">supervise</text><line x1="700.0" y1="83.0" x2="750.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="725.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">differentiate</text><line x1="940.0" y1="83.0" x2="990.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="965.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">update</text><line x1="1180.0" y1="83.0" x2="1230.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="1205.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">checkpoint</text><g><title>Inputs and learned tensors</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">Batch + parameters</tspan></text></g><g><title>Differentiable model computation</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">Forward logits</tspan></text></g><g><title>Objective excluding PAD labels</title><rect x="510" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="605.0" y="88.0">Valid-token loss</tspan></text></g><g><title>Chain rule through model</title><rect x="750" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="845.0" y="88.0">Backward gradients</tspan></text></g><g><title>Finite gradients and bounded update</title><rect x="990" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="1085.0" y="88.0">Clip + optimizer</tspan></text></g><g><title>No pending accumulated gradients</title><rect x="1230" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="1325.0" y="79.0">Complete save</tspan><tspan x="1325.0" y="97.0">boundary</tspan></text></g></svg>
