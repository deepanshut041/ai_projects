<svg xmlns="http://www.w3.org/2000/svg" width="570" height="485" role="img" aria-labelledby="title" viewBox="0 0 570 485"><title id="title">Parallel training, autoregressive prediction</title><desc>Source memory, shifted target inputs and next-token labels are different streams.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">encode</text><line x1="365.0" y1="121.0" x2="365.0" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="450.0" y="158.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">K / V</text><line x1="220.0" y1="233.0" x2="270.0" y2="233.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="183.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">Q / causal prefix</text><line x1="304.2" y1="271.0" x2="185.8" y2="345.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="183.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">vocabulary map</text><g><title>Encoder sees valid source tokens.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">Source IDs[B,S]</tspan></text></g><g><title>Cross-attention keys/values come from here.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">Encoder memory[B,S,D]</tspan></text></g><g><title>BOS and previous target tokens supply decoder input.</title><rect x="30" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="238.0">Shifted prefix[B,T]</tspan></text></g><g><title>Causal self-attention and source retrieval.</title><rect x="270" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="238.0">Decoder states[B,T,D]</tspan></text></g><g><title>Supervise next tokens; ignore padded labels.</title><rect x="30" y="345" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="388.0">Logits[B,T,V]</tspan></text></g></svg>
