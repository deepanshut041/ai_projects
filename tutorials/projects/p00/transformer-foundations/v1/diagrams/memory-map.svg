<svg xmlns="http://www.w3.org/2000/svg" width="620" height="595" role="img" aria-labelledby="title" viewBox="0 0 620 595"><title id="title">Memory concerns: payload and lifetime</title><desc>Organization edges are concerns, not tensor movement. Parameters/optimizer persist; scores/activations are temporary; per-request encoder memory is recreated; persistent checkpoint copies live outside runtime scratch.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="178.54545454545456" y1="265.0" x2="381.45454545454544" y2="121.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="220.0" y1="269.2903225806452" x2="340.0" y2="226.70967741935485" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="220.0" y1="303.0" x2="340.0" y2="303.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="220.0" y1="336.7096774193548" x2="340.0" y2="379.2903225806452" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="178.54545454545456" y1="341.0" x2="381.45454545454544" y2="485.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>Ask dtype, size, lifetime and ownership</title><rect x="30" y="265" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="308.0">Memory ledger</tspan></text></g><g><title>Persistent model tensors</title><rect x="340" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="435.0" y="88.0">Weights + buffers</tspan></text></g><g><title>Training state payload</title><rect x="340" y="155" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="435.0" y="198.0">Gradients + Adam</tspan></text></g><g><title>Temporary/backward activations</title><rect x="340" y="265" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="435.0" y="308.0">Attention + FFN</tspan></text></g><g><title>Source encoding; no decoder KV cache here</title><rect x="340" y="375" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="435.0" y="418.0">Request memory</tspan></text></g><g><title>Serialized generations and retention</title><rect x="340" y="485" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="435.0" y="528.0">Checkpoint copies</tspan></text></g></svg>
