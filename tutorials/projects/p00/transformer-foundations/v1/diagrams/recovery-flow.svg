<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="185" role="img" aria-labelledby="title" viewBox="0 0 1290 185"><title id="title">Recover a training process: verify before continuing</title><desc>The completion marker is written last and is insufficient without manifest/files. Reject incomplete/corrupt/incompatible candidates, report fallback, restore RNG last, then advance.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">serialize</text><line x1="460.0" y1="83.0" x2="510.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="485.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">persist</text><line x1="700.0" y1="83.0" x2="750.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="725.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">verify</text><line x1="940.0" y1="83.0" x2="990.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="965.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">continue</text><g><title>No pending gradients</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">Complete update K</tspan></text></g><g><title>Weights, optimizer, RNG, data, identity</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">Snapshot full state</tspan></text></g><g><title>Copy bytes + manifest, verify, COMPLETE</title><rect x="510" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="605.0" y="88.0">Immutable generation</tspan></text></g><g><title>Fallback with explicit rollback</title><rect x="750" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="845.0" y="79.0">Select valid</tspan><tspan x="845.0" y="97.0">candidate</tspan></text></g><g><title>RNG restored after setup</title><rect x="990" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="1085.0" y="79.0">Restore then batch</tspan><tspan x="1085.0" y="97.0">K+1</tspan></text></g></svg>
