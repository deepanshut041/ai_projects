<svg xmlns="http://www.w3.org/2000/svg" width="570" height="335" role="img" aria-labelledby="title" viewBox="0 0 570 335"><title id="title">Two prerequisite strands for the full model</title><desc>Arrows mean prerequisite understanding. Tensor math/autograd supports attention; exact bytes and frozen tokenization support batch/shift contracts. These strands meet when assembling and training the complete model; bytes do not require prior matrix calculus.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">needed for</text><line x1="220.0" y1="233.0" x2="270.0" y2="233.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="183.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">needed for</text><g><title>Axes, matrix products, loss and gradient</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">Tensors + derivatives</tspan></text></g><g><title>Permitted information movement</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">Attention + masks</tspan></text></g><g><title>Exact content IDs and frozen vocabulary</title><rect x="30" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="238.0">Bytes + merge ranks</tspan></text></g><g><title>Legal prefixes and valid supervised targets</title><rect x="270" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="238.0">Shift + padding</tspan></text></g></svg>
