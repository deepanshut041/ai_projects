<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="185" role="img" aria-labelledby="title" viewBox="0 0 1050 185"><title id="title">A complete state survives a fresh process</title><desc>Save model, optimizer, schedule, sampler, progress and RNG after a completed update. Verify persisted generations, mark completion last and retain good fallback states.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="460.0" y1="83.0" x2="510.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="700.0" y1="83.0" x2="750.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>Stable training boundary.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">completed update K</tspan></text></g><g><title>Source/config/data/runtime must agree.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">state + identity/hash</tspan></text></g><g><title>Incomplete writes are ignored.</title><rect x="510" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="605.0" y="79.0">completion record</tspan><tspan x="605.0" y="97.0">last</tspan></text></g><g><title>Resume advanced state before fetching data.</title><rect x="750" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="845.0" y="88.0">fresh-process restore</tspan></text></g></svg>
