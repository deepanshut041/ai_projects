<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" role="img" aria-labelledby="title">
<title id="title">Independent row functions versus a gathered output with contributions from multiple rows</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7cc8ff"/></marker></defs>
<rect width="560" height="560" rx="12" fill="#101c2c"/>
<g font-family="DejaVu Sans, sans-serif"><text x="280" y="32" fill="#e8eef7" font-size="22" text-anchor="middle">A local transform has no cross-row path</text><rect x="15" y="58" width="110" height="52" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="70.0" y="91.0" fill="#7cc8ff" font-size="21" text-anchor="middle">x0</text><path d="M70,110 L70,147" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="15" y="149" width="110" height="52" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="70.0" y="182.0" fill="#7cc8ff" font-size="21" text-anchor="middle">f(x0)</text><rect x="155" y="58" width="110" height="52" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="210.0" y="91.0" fill="#7cc8ff" font-size="21" text-anchor="middle">x1</text><path d="M210,110 L210,147" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="155" y="149" width="110" height="52" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="210.0" y="182.0" fill="#7cc8ff" font-size="21" text-anchor="middle">f(x1)</text><rect x="295" y="58" width="110" height="52" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="350.0" y="91.0" fill="#7cc8ff" font-size="21" text-anchor="middle">x2</text><path d="M350,110 L350,147" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="295" y="149" width="110" height="52" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="350.0" y="182.0" fill="#7cc8ff" font-size="21" text-anchor="middle">f(x2)</text><rect x="435" y="58" width="110" height="52" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="490.0" y="91.0" fill="#7cc8ff" font-size="21" text-anchor="middle">x3</text><path d="M490,110 L490,147" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="435" y="149" width="110" height="52" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="490.0" y="182.0" fill="#7cc8ff" font-size="21" text-anchor="middle">f(x3)</text><text x="280" y="238" fill="#e8eef7" font-size="21" text-anchor="middle">Changing x0 cannot change f(x1).</text><text x="280" y="292" fill="#e8eef7" font-size="22" text-anchor="middle">Gathering creates the missing path</text><rect x="15" y="316" width="110" height="70" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="70.0" y="344.0" fill="#7cc8ff" font-size="21" text-anchor="middle">v0</text><text x="70.0" y="372.0" fill="#e8eef7" font-size="21" text-anchor="middle">[2,0]</text><path d="M70,386 L280,449" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="155" y="316" width="110" height="70" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="210.0" y="344.0" fill="#7cc8ff" font-size="21" text-anchor="middle">v1</text><text x="210.0" y="372.0" fill="#e8eef7" font-size="21" text-anchor="middle">[0,2]</text><path d="M210,386 L280,449" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="295" y="316" width="110" height="70" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="350.0" y="344.0" fill="#7cc8ff" font-size="21" text-anchor="middle">v2</text><text x="350.0" y="372.0" fill="#e8eef7" font-size="21" text-anchor="middle">[2,2]</text><path d="M350,386 L280,449" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="435" y="316" width="110" height="70" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="490.0" y="344.0" fill="#7cc8ff" font-size="21" text-anchor="middle">v3</text><text x="490.0" y="372.0" fill="#e8eef7" font-size="21" text-anchor="middle">[0,0]</text><path d="M490,386 L280,449" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="452" width="520" height="80" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="280.0" y="485.0" fill="#7cc8ff" font-size="21" text-anchor="middle">c0 = a00 v0 + a01 v1 + a02 v2 + a03 v3</text><text x="280.0" y="513.0" fill="#e8eef7" font-size="21" text-anchor="middle">Each value can contribute to receiver 0</text></g></svg>