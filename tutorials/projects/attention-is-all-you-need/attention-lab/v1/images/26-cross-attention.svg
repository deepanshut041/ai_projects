<svg xmlns="http://www.w3.org/2000/svg" width="560" height="600" viewBox="0 0 560 600" role="img" aria-labelledby="title">
<title id="title">Two target receivers read four source memory positions producing two output rows</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7cc8ff"/></marker></defs>
<rect width="560" height="600" rx="12" fill="#101c2c"/>
<g font-family="DejaVu Sans, sans-serif"><text x="280" y="32" fill="#e8eef7" font-size="23" text-anchor="middle">Cross-attention changes vector origins</text><rect x="20" y="58" width="520" height="80" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="280.0" y="91.0" fill="#7cc8ff" font-size="21" text-anchor="middle">Encoder memory: 4 source rows</text><text x="280.0" y="119.0" fill="#e8eef7" font-size="21" text-anchor="middle">K: (4,2) and V: (4,2)</text><rect x="20" y="172" width="520" height="80" rx="9" fill="#18273b" stroke="#84e2be" stroke-width="2"/><text x="280.0" y="205.0" fill="#84e2be" font-size="21" text-anchor="middle">Causal decoder states: 2 receiving rows</text><text x="280.0" y="233.0" fill="#e8eef7" font-size="21" text-anchor="middle">Q: (2,2)</text><path d="M540,97 L550,97 L550,315 L540,315" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M280,252 L280,283" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="286" width="520" height="90" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="280.0" y="324.0" fill="#7cc8ff" font-size="21" text-anchor="middle">Q @ K.T → weights (2,4)</text><text x="280.0" y="352.0" fill="#e8eef7" font-size="21" text-anchor="middle">Each target row compares all 4 source keys</text><path d="M280,376 L280,405" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="408" width="520" height="90" rx="9" fill="#18273b" stroke="#84e2be" stroke-width="2"/><text x="280.0" y="446.0" fill="#84e2be" font-size="21" text-anchor="middle">weights @ V → context (2,2)</text><text x="280.0" y="474.0" fill="#e8eef7" font-size="21" text-anchor="middle">2 receivers each get 2 gathered features</text><text x="280" y="538" fill="#e8eef7" font-size="21" text-anchor="middle">Output length follows Q, not source memory.</text><text x="280" y="574" fill="#e8eef7" font-size="20" text-anchor="middle">Key validity has 4 entries: one per source row.</text></g></svg>