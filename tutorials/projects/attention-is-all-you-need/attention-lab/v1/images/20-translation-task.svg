<svg xmlns="http://www.w3.org/2000/svg" width="560" height="672" viewBox="0 0 560 672" role="img" aria-labelledby="title">
<title id="title">Read the English source and repeatedly choose and append a French token using the source and output so far</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7cc8ff"/></marker></defs>
<rect width="560" height="672" rx="12" fill="#101c2c"/>
<g font-family="DejaVu Sans, sans-serif"><text x="280" y="32" fill="#e8eef7" font-size="23" text-anchor="middle">The whole translation process</text><rect x="40" y="54" width="480" height="60" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="280.0" y="91.0" fill="#7cc8ff" font-size="21" text-anchor="middle">English source: We | read | books | daily</text><path d="M280,114 L280,140" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="142" width="480" height="70" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="280.0" y="184.0" fill="#7cc8ff" font-size="21" text-anchor="middle">Build useful information from the source</text><rect x="40" y="264" width="480" height="70" rx="9" fill="#18273b" stroke="#84e2be" stroke-width="2"/><text x="280.0" y="306.0" fill="#84e2be" font-size="21" text-anchor="middle">French generated so far: Nous</text><path d="M280,334 L280,370" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520,177 L540,177 L540,411 L520,411" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="374" width="480" height="80" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="280.0" y="407.0" fill="#7cc8ff" font-size="21" text-anchor="middle">Use source information + French so far</text><text x="280.0" y="435.0" fill="#e8eef7" font-size="21" text-anchor="middle">Predict the next token: lisons</text><path d="M280,454 L280,490" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="494" width="480" height="80" rx="9" fill="#18273b" stroke="#84e2be" stroke-width="2"/><text x="280.0" y="527.0" fill="#84e2be" font-size="21" text-anchor="middle">Append that token to the output</text><text x="280.0" y="555.0" fill="#e8eef7" font-size="21" text-anchor="middle">French generated so far: Nous lisons</text><path d="M40,534 L20,534 L20,299 L40,299" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><text x="280" y="613" fill="#e8eef7" font-size="21" text-anchor="middle">Repeat using the growing French prefix.</text><text x="280" y="648" fill="#e8eef7" font-size="19" text-anchor="middle">Next we open one information-sharing operation.</text></g></svg>