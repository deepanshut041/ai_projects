<svg xmlns="http://www.w3.org/2000/svg" width="560" height="600" viewBox="0 0 560 600" role="img" aria-labelledby="title">
<title id="title">Two one feature heads independently normalize weights then rejoin features within each position</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7cc8ff"/></marker></defs>
<rect width="560" height="600" rx="12" fill="#101c2c"/>
<g font-family="DejaVu Sans, sans-serif"><text x="280" y="32" fill="#e8eef7" font-size="22" text-anchor="middle">Split projected features; keep every position</text><rect x="20" y="58" width="520" height="70" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="280.0" y="86.0" fill="#7cc8ff" font-size="21" text-anchor="middle">Projected Q/K/V: (B,T,2)</text><text x="280.0" y="114.0" fill="#e8eef7" font-size="21" text-anchor="middle">Reshape (B,T,2,1) → transpose (B,2,T,1)</text><path d="M180,128 L145,168" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M380,128 L415,168" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="172" width="250" height="170" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="145.0" y="208.0" fill="#7cc8ff" font-size="21" text-anchor="middle">Head 0, receiver 0</text><text x="145.0" y="236.0" fill="#e8eef7" font-size="21" text-anchor="middle">q = [1]</text><text x="145.0" y="264.0" fill="#e8eef7" font-size="21" text-anchor="middle">[.366,.134]</text><text x="145.0" y="292.0" fill="#e8eef7" font-size="21" text-anchor="middle">repeated twice</text><text x="145.0" y="320.0" fill="#e8eef7" font-size="21" text-anchor="middle">context = 1.462117</text><rect x="290" y="172" width="250" height="170" rx="9" fill="#18273b" stroke="#84e2be" stroke-width="2"/><text x="415.0" y="208.0" fill="#84e2be" font-size="21" text-anchor="middle">Head 1, receiver 0</text><text x="415.0" y="236.0" fill="#e8eef7" font-size="21" text-anchor="middle">q = [0]</text><text x="415.0" y="264.0" fill="#e8eef7" font-size="21" text-anchor="middle">weights =</text><text x="415.0" y="292.0" fill="#e8eef7" font-size="21" text-anchor="middle">[1/4,1/4,1/4,1/4]</text><text x="415.0" y="320.0" fill="#e8eef7" font-size="21" text-anchor="middle">context = 1.000000</text><path d="M145,342 L280,395" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M415,342 L280,395" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="398" width="520" height="80" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="280.0" y="431.0" fill="#7cc8ff" font-size="21" text-anchor="middle">Transpose back, then join each token’s heads</text><text x="280.0" y="459.0" fill="#e8eef7" font-size="21" text-anchor="middle">Position 0: [1.462117,1.000000]</text><path d="M280,478 L280,508" fill="none" stroke="#7cc8ff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="510" width="520" height="62" rx="9" fill="#18273b" stroke="#7cc8ff" stroke-width="2"/><text x="280.0" y="548.0" fill="#7cc8ff" font-size="21" text-anchor="middle">Apply output map W_O</text></g></svg>