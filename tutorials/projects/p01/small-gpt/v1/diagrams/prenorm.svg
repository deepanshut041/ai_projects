<svg xmlns="http://www.w3.org/2000/svg" width="570" height="335" role="img" aria-labelledby="title" viewBox="0 0 570 335"><title id="title">One pre-norm residual branch</title><desc>Trace the direct residual and normalized sublayer paths separately. The FFN branch repeats this pattern.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">sublayer path</text><line x1="365.0" y1="121.0" x2="365.0" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="450.0" y="158.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">normalized input</text><line x1="270.0" y1="233.0" x2="220.0" y2="233.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="183.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">update</text><line x1="125.0" y1="121.0" x2="125.0" y2="195.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="210.0" y="158.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">direct residual</text><g><title>The direct residual stream remains available.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">Input X</tspan></text></g><g><title>Normalize each position over D features.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">LayerNorm(X)</tspan></text></g><g><title>Both paths meet in addition, preserving [B,T,D].</title><rect x="30" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="238.0">X + update</tspan></text></g><g><title>Causal sublayer returns an update with the same shape.</title><rect x="270" y="195" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="238.0">Attention(LN(X))</tspan></text></g></svg>
