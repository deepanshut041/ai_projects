<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="185" role="img" aria-labelledby="title" viewBox="0 0 1050 185"><title id="title">Learning route: derive and check prefix-only mixing</title><desc>Concept prerequisites for this toy task: permitted positions motivate zero future contribution, then a prefix mixture and an invariance check. These are understanding relationships, not tensor execution arrows or observed learner progress.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">grounds</text><line x1="460.0" y1="83.0" x2="510.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="485.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">grounds</text><line x1="700.0" y1="83.0" x2="750.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="725.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">grounds</text><g><title>Permitted positions under the prefix-only task premise.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">Allowed prefix</tspan></text></g><g><title>Forbidden values must contribute zero weight in this attention mixture.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">Zero future weight</tspan></text></g><g><title>Compute the weighted sum over the permitted positions.</title><rect x="510" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="605.0" y="88.0">Prefix mixture</tspan></text></g><g><title>Check the mixture is unchanged when only a forbidden value changes.</title><rect x="750" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="845.0" y="88.0">Future-change test</tspan></text></g></svg>
