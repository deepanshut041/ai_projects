<svg xmlns="http://www.w3.org/2000/svg" width="620" height="485" role="img" aria-labelledby="title" viewBox="0 0 620 485"><title id="title">Memory map: ask what lives and grows</title><desc>Weights persist across tokens. K/V grows with cached context; attention intermediates and training state have different lifetimes. Offloading also moves bytes and takes time.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="196.39393939393938" y1="210.0" x2="363.6060606060606" y2="121.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="220.0" y1="231.1451612903226" x2="340.0" y2="209.8548387096774" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="220.0" y1="264.85483870967744" x2="340.0" y2="286.14516129032256" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><line x1="196.39393939393938" y1="286.0" x2="363.6060606060606" y2="375.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><g><title>Account separately before researching changes.</title><rect x="30" y="210" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="253.0">Memory and access</tspan></text></g><g><title>Parameter storage, not K/V.</title><rect x="340" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="435.0" y="88.0">Persistent weights</tspan></text></g><g><title>Two tensors per layer for MHA.</title><rect x="340" y="155" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="435.0" y="198.0">Growing K/V state</tspan></text></g><g><title>Prefill scores and implementation workspace.</title><rect x="340" y="265" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="435.0" y="308.0">Temporary tensors</tspan></text></g><g><title>Gradients, activations and optimizer slots.</title><rect x="340" y="375" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="435.0" y="418.0">Training state</tspan></text></g></svg>
