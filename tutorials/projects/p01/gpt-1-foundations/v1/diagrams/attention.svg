<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="185" role="img" aria-labelledby="title" viewBox="0 0 1290 185"><title id="title">Attention: score, hide, normalize, mix</title><desc>Q asks for useful context, K supplies matching addresses and V supplies content. The mask acts before softmax. With every allowed score zero, weights are uniform.</desc><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718096"/></marker></defs><line x1="220.0" y1="83.0" x2="270.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="245.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">then</text><line x1="460.0" y1="83.0" x2="510.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="485.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">then</text><line x1="700.0" y1="83.0" x2="750.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="725.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">then</text><line x1="940.0" y1="83.0" x2="990.0" y2="83.0" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/><text x="965.0" y="33.0" text-anchor="middle" fill="#435269" font-family="sans-serif" font-size="12">then</text><g><title>Split width D into H heads of d=D/H.</title><rect x="30" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="125.0" y="88.0">Q K V [B,H,T,d]</tspan></text></g><g><title>One score for each query/key pair.</title><rect x="270" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="365.0" y="88.0">QK^T / sqrt(d)</tspan></text></g><g><title>Disallowed scores become negative infinity.</title><rect x="510" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="605.0" y="88.0">Hide j &gt; i</tspan></text></g><g><title>Normalize only the visible prefix.</title><rect x="750" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="845.0" y="88.0">Row softmax</tspan></text></g><g><title>Sum V using the row weights.</title><rect x="990" y="45" width="190" height="76" rx="12" fill="#f1f5fa" stroke="#a5b4c7" stroke-width="2"/><text text-anchor="middle" font-family="sans-serif" font-size="15" fill="#132842"><tspan x="1085.0" y="88.0">Weighted values</tspan></text></g></svg>
