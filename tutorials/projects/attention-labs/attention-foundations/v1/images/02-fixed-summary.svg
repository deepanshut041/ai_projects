<text x="30" y="45" font-family="Arial,sans-serif" fill="#173d3b" font-size="27" font-weight="bold">All source information crosses one final summary</text><rect x="50" y="110" width="180" height="85" rx="8" fill="#e1f2ec" stroke="#4f8a7d" stroke-width="2" /><text x="66" y="144" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">h₁</text><text x="66" y="174" font-family="Arial,sans-serif" fill="#173d3b" font-size="18">first input</text><path d="M235 152L322 152" stroke="#376b66" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="330" y="110" width="180" height="85" rx="8" fill="#e1f2ec" stroke="#4f8a7d" stroke-width="2" /><text x="346" y="144" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">h₂</text><text x="346" y="174" font-family="Arial,sans-serif" fill="#173d3b" font-size="18">prefix summary</text><path d="M515 152L602 152" stroke="#376b66" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="610" y="110" width="180" height="85" rx="8" fill="#e1f2ec" stroke="#4f8a7d" stroke-width="2" /><text x="626" y="144" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">h₃ = c</text><text x="626" y="174" font-family="Arial,sans-serif" fill="#173d3b" font-size="18">fixed handoff</text><text x="50" y="270" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">Toy recurrence: hₜ = 0.5 hₜ₋₁ + xₜ</text><text x="50" y="315" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">Inputs [1, 0, 2] → states [1, 0.5, 2.25]</text><text x="50" y="360" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">Earlier input coefficient at step 3: 0.5 × 0.5 = 0.25</text></svg>