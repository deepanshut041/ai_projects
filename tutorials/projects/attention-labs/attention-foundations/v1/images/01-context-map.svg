<svg xmlns="http://www.w3.org/2000/svg" width="920" height="365" viewBox="0 0 920 365" role="img" aria-label="From input information to a contextual prediction">
<title>From input information to a contextual prediction</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#376b66" /></marker></defs>
<rect width="920" height="365" rx="12" fill="#f8fbfa" />
<text x="30" y="45" font-family="Arial,sans-serif" fill="#173d3b" font-size="27" font-weight="bold">From input information to a contextual prediction</text><rect x="30" y="100" width="210" height="85" rx="8" fill="#e1f2ec" stroke="#4f8a7d" stroke-width="2" /><text x="46" y="134" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">Input positions</text><text x="46" y="164" font-family="Arial,sans-serif" fill="#173d3b" font-size="18">token feature rows</text><path d="M245 142L325 142" stroke="#376b66" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="330" y="100" width="240" height="85" rx="8" fill="#e1f2ec" stroke="#4f8a7d" stroke-width="2" /><text x="346" y="134" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">Retrieve context</text><text x="346" y="164" font-family="Arial,sans-serif" fill="#173d3b" font-size="18">compare → weight → mix</text><path d="M575 142L655 142" stroke="#376b66" stroke-width="3" fill="none" marker-end="url(#arrow)" /><rect x="660" y="100" width="230" height="85" rx="8" fill="#e1f2ec" stroke="#4f8a7d" stroke-width="2" /><text x="676" y="134" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">Predict a token</text><text x="676" y="164" font-family="Arial,sans-serif" fill="#173d3b" font-size="18">vocabulary logits</text><text x="40" y="270" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">Attention returns features; a separate head predicts vocabulary tokens.</text><text x="40" y="315" font-family="Arial,sans-serif" fill="#173d3b" font-size="22">A new query can retrieve a new mixture from the same stored content.</text></svg>