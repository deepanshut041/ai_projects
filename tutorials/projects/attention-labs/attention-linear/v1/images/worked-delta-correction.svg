<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img"><title>Correct the prediction instead of accumulating another full value</title><desc>After writing 2 at unit key [1,0], state S = [2,0]ᵀ. The next value is 5.</desc>
<rect x="0" y="0" width="1160" height="650" rx="0" fill="#f8f8fd"/>
<rect x="0" y="0" width="1160" height="8" rx="0" fill="#6846c7"/>
<text x="36" y="48" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17253f">Correct the prediction instead of accumulating another full value</text>
<text x="36" y="81" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#53617b">After writing 2 at unit key [1,0], state S = [2,0]ᵀ. The next value is 5.</text>
<rect x="36" y="120" width="330" height="135" rx="12" fill="#ffffff" stroke="#d9deec" stroke-width="1.5"/>
<text x="54" y="152" font-family="DejaVu Sans" font-size="21" font-weight="700" text-anchor="start" fill="#2563b9">Predict</text>
<text x="54" y="204" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#17253f">k S = 2</text>
<rect x="415" y="120" width="330" height="135" rx="12" fill="#ffffff" stroke="#d9deec" stroke-width="1.5"/>
<text x="433" y="152" font-family="DejaVu Sans" font-size="21" font-weight="700" text-anchor="start" fill="#6846c7">Compare</text>
<text x="433" y="204" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#17253f">residual = 5 − 2 = 3</text>
<rect x="794" y="120" width="330" height="135" rx="12" fill="#ffffff" stroke="#d9deec" stroke-width="1.5"/>
<text x="812" y="152" font-family="DejaVu Sans" font-size="21" font-weight="700" text-anchor="start" fill="#16735e">Correct</text>
<text x="812" y="204" font-family="DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" fill="#17253f">Snew = S + β [3,0]ᵀ</text>
<line x1="372" y1="187" x2="407" y2="187" stroke="#6846c7" stroke-width="2.5"/>
<polygon points="407.00,187.00 396.87,191.28 396.87,182.72" fill="#6846c7"/>
<line x1="751" y1="187" x2="786" y2="187" stroke="#6846c7" stroke-width="2.5"/>
<polygon points="786.00,187.00 775.87,191.28 775.87,182.72" fill="#6846c7"/>
<text x="36" y="330" font-family="DejaVu Sans" font-size="23" font-weight="700" text-anchor="start" fill="#17253f">β = 0</text>
<rect x="230" y="300" width="650" height="40" rx="4" fill="#e9edf6"/>
<rect x="230" y="300" width="260.0" height="40" rx="4" fill="#2563b9"/>
<text x="905" y="330" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#2563b9">read = 2</text>
<text x="36" y="411" font-family="DejaVu Sans" font-size="23" font-weight="700" text-anchor="start" fill="#17253f">β = 0.25</text>
<rect x="230" y="381" width="650" height="40" rx="4" fill="#e9edf6"/>
<rect x="230" y="381" width="357.5" height="40" rx="4" fill="#16735e"/>
<text x="905" y="411" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#16735e">read = 2.75</text>
<text x="36" y="492" font-family="DejaVu Sans" font-size="23" font-weight="700" text-anchor="start" fill="#17253f">β = 1</text>
<rect x="230" y="462" width="650" height="40" rx="4" fill="#e9edf6"/>
<rect x="230" y="462" width="650.0" height="40" rx="4" fill="#b65a1c"/>
<text x="905" y="492" font-family="DejaVu Sans" font-size="24" font-weight="700" text-anchor="start" fill="#b65a1c">read = 5</text>
<line x1="490" y1="289" x2="490" y2="507" stroke="#53617b" stroke-width="2" stroke-dasharray="6 5"/>
<text x="230" y="551" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="start" fill="#17253f">0</text>
<text x="490" y="551" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="middle" fill="#17253f">old read = 2</text>
<text x="880" y="551" font-family="DejaVu Sans" font-size="19" font-weight="400" text-anchor="end" fill="#17253f">target = 5</text>
<text x="36" y="610" font-family="DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" fill="#17253f">Same-key output = (1−β) × 2 + β × 5, because the key has unit norm.</text>
</svg>