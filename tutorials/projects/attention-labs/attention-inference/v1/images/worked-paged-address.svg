<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img"><title>Translate a token position without changing its logical order</title><desc>Zero-based token 11, block size P = 4, logical block table [37,12,91].</desc>
<rect x="0" y="0" width="1160" height="650" rx="0" fill="#f8f8fd"/>
<rect x="0" y="0" width="1160" height="8" rx="0" fill="#6846c7"/>
<text x="36" y="48" font-family="DejaVu Sans" font-size="28" font-weight="700" text-anchor="start" fill="#17253f">Translate a token position without changing its logical order</text>
<text x="36" y="81" font-family="DejaVu Sans" font-size="18" font-weight="400" text-anchor="start" fill="#53617b">Zero-based token 11, block size P = 4, logical block table [37,12,91].</text>
<rect x="36" y="119" width="290" height="154" rx="12" fill="#ffffff" stroke="#d9deec" stroke-width="1.5"/>
<text x="54" y="151" font-family="DejaVu Sans" font-size="21" font-weight="700" text-anchor="start" fill="#2563b9">Logical token</text>
<text x="54" y="193" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#17253f">position t = 11</text>
<rect x="402" y="119" width="350" height="154" rx="12" fill="#ffffff" stroke="#d9deec" stroke-width="1.5"/>
<text x="420" y="151" font-family="DejaVu Sans" font-size="21" font-weight="700" text-anchor="start" fill="#6846c7">Split its address</text>
<text x="420" y="193" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#17253f">block = floor(11/4) = 2</text>
<text x="420" y="224" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#17253f">offset = 11 mod 4 = 3</text>
<rect x="828" y="119" width="296" height="154" rx="12" fill="#ffffff" stroke="#d9deec" stroke-width="1.5"/>
<text x="846" y="151" font-family="DejaVu Sans" font-size="21" font-weight="700" text-anchor="start" fill="#16735e">Physical address</text>
<text x="846" y="193" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#17253f">block table[2] = 91</text>
<text x="846" y="224" font-family="DejaVu Sans" font-size="21" font-weight="400" text-anchor="start" fill="#17253f">read slot 3 in block 91</text>
