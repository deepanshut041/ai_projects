<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title description"><title id="title">One answer, three separate checks</title><desc id="description">A correct answer can cite an existing passage that does not support the claim.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#486687"/></marker></defs><rect width="900" height="410" fill="#f8fbff"/><g font-family="sans-serif"><text x="28" y="42" font-size="27" fill="#18263c">One answer, three separate checks</text><rect x="30" y="85" width="250" height="100" rx="12" fill="#e4efff" stroke="#7892b5"/><text x="46" y="119" font-size="21" fill="#18263c">Question</text><text x="46" y="150" font-size="18" fill="#18263c">Full charge duration?</text><line x1="285" y1="135" x2="325" y2="135" stroke="#486687" stroke-width="3" marker-end="url(#arrow)"/><rect x="335" y="85" width="530" height="100" rx="12" fill="#e4efff" stroke="#7892b5"/><text x="351" y="119" font-size="21" fill="#18263c">Response: 3 hours; citation: lumen-2</text><text x="351" y="150" font-size="18" fill="#18263c">lumen-2 describes the power button</text><rect x="30" y="235" width="255" height="100" rx="12" fill="#e0f5e9" stroke="#7892b5"/><text x="46" y="269" font-size="21" fill="#18263c">Correct fact: yes</text><text x="46" y="300" font-size="18" fill="#18263c">3 hours matches gold</text><rect x="320" y="235" width="255" height="100" rx="12" fill="#e0f5e9" stroke="#7892b5"/><text x="336" y="269" font-size="21" fill="#18263c">Valid ID: yes</text><text x="336" y="300" font-size="18" fill="#18263c">lumen-2 exists</text><rect x="610" y="235" width="255" height="100" rx="12" fill="#ffe7df" stroke="#7892b5"/><text x="626" y="269" font-size="21" fill="#18263c">Supported: no</text><text x="626" y="300" font-size="18" fill="#18263c">Wrong evidence</text><text x="30" y="382" font-size="22" fill="#18263c">Acceptance requires the claim AND the evidence contract.</text></g></svg>