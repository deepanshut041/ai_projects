<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title description"><title id="title">Weight storage does not equal request memory</title><desc id="description">A budget stacks weights, cache, workspace and reserve. A longer cache can exceed capacity.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#486687"/></marker></defs><rect width="900" height="420" fill="#f8fbff"/><g font-family="sans-serif"><text x="28" y="42" font-size="27" fill="#18263c">Weight storage does not equal request memory</text><rect x="35" y="100" width="288.13125" height="72" fill="#8cb6f5" stroke="#fff"/><rect x="323.13125" y="100" width="137.5" height="72" fill="#8fd2b1" stroke="#fff"/><rect x="460.63125" y="100" width="68.75" height="72" fill="#f0cf7b" stroke="#fff"/><rect x="529.38125" y="100" width="137.5" height="72" fill="#c5b4eb" stroke="#fff"/><rect x="35" y="215" width="400" height="75" rx="12" fill="#8cb6f5" stroke="#7892b5"/><text x="51" y="249" font-size="21" fill="#18263c">weights: 4.191 GiB</text><text x="51" y="280" font-size="18" fill="#18263c">Illustrative allowance</text><rect x="465" y="215" width="400" height="75" rx="12" fill="#8fd2b1" stroke="#7892b5"/><text x="481" y="249" font-size="21" fill="#18263c">cache: 2.000 GiB</text><text x="481" y="280" font-size="18" fill="#18263c">Illustrative allowance</text><rect x="35" y="303" width="400" height="75" rx="12" fill="#f0cf7b" stroke="#7892b5"/><text x="51" y="337" font-size="21" fill="#18263c">workspace: 1.000 GiB</text><text x="51" y="368" font-size="18" fill="#18263c">Illustrative allowance</text><rect x="465" y="303" width="400" height="75" rx="12" fill="#c5b4eb" stroke="#7892b5"/><text x="481" y="337" font-size="21" fill="#18263c">reserve: 2.000 GiB</text><text x="481" y="368" font-size="18" fill="#18263c">Illustrative allowance</text><text x="35" y="193" font-size="20" fill="#18263c">9.191 GiB including reserve; 12 GiB illustrative capacity</text></g></svg>