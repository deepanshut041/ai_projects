<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title description"><title id="title">Logical cache counts distinct owners</title><desc id="description">Two layers share a sliding cache owner, while a full-context owner grows with sequence length.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#486687"/></marker></defs><rect width="900" height="510" fill="#f8fbff"/><g font-family="sans-serif"><text x="28" y="42" font-size="27" fill="#18263c">Logical cache counts distinct owners</text><rect x="30" y="90" width="245" height="90" rx="12" fill="#e4efff" stroke="#7892b5"/><text x="46" y="124" font-size="21" fill="#18263c">Layer 1</text><text x="46" y="155" font-size="18" fill="#18263c">uses owner s</text><rect x="30" y="210" width="245" height="90" rx="12" fill="#e4efff" stroke="#7892b5"/><text x="46" y="244" font-size="21" fill="#18263c">Layer 2</text><text x="46" y="275" font-size="18" fill="#18263c">uses owner s</text><line x1="285" y1="140" x2="380" y2="165" stroke="#486687" stroke-width="3" marker-end="url(#arrow)"/><line x1="285" y1="255" x2="380" y2="200" stroke="#486687" stroke-width="3" marker-end="url(#arrow)"/><rect x="395" y="115" width="470" height="110" rx="12" fill="#e0f5e9" stroke="#7892b5"/><text x="411" y="149" font-size="21" fill="#18263c">Owner s: sliding window 512</text><text x="411" y="180" font-size="18" fill="#18263c">262,144 bytes once T ≥ 512</text><rect x="30" y="335" width="245" height="90" rx="12" fill="#e4efff" stroke="#7892b5"/><text x="46" y="369" font-size="21" fill="#18263c">Layer 3</text><text x="46" y="400" font-size="18" fill="#18263c">uses owner f</text><line x1="285" y1="380" x2="380" y2="380" stroke="#486687" stroke-width="3" marker-end="url(#arrow)"/><rect x="395" y="325" width="470" height="110" rx="12" fill="#e4efff" stroke="#7892b5"/><text x="411" y="359" font-size="21" fill="#18263c">Owner f: full history</text><text x="411" y="390" font-size="18" fill="#18263c">2,097,152 bytes at T=2048</text><text x="30" y="480" font-size="20" fill="#18263c">At T=2048: total 2,359,296 bytes. This is not the Gemma map.</text></g></svg>