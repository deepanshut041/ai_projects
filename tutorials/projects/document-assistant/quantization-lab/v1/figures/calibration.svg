<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title description"><title id="title">Equal weight MSE, unequal output error</title><desc id="description">Two equal-size row errors have different output mean squared error when calibration inputs amplify the first channel.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#486687"/></marker></defs><rect width="900" height="410" fill="#f8fbff"/><g font-family="sans-serif"><text x="28" y="42" font-size="27" fill="#18263c">Equal weight MSE, unequal output error</text><rect x="30" y="90" width="400" height="110" rx="12" fill="#e4efff" stroke="#7892b5"/><text x="46" y="124" font-size="21" fill="#18263c">Calibration inputs</text><text x="46" y="155" font-size="18" fill="#18263c">[4, 1] and [4, −1]</text><rect x="470" y="90" width="400" height="110" rx="12" fill="#e4efff" stroke="#7892b5"/><text x="486" y="124" font-size="21" fill="#18263c">Gram matrix G</text><text x="486" y="155" font-size="18" fill="#18263c">[16, 0]; [0, 1]</text><rect x="30" y="245" width="400" height="110" rx="12" fill="#ffe7df" stroke="#7892b5"/><text x="46" y="279" font-size="21" fill="#18263c">Error A = [0.25, 0]</text><text x="46" y="310" font-size="18" fill="#18263c">Output MSE = 1.0000</text><rect x="470" y="245" width="400" height="110" rx="12" fill="#e0f5e9" stroke="#7892b5"/><text x="486" y="279" font-size="21" fill="#18263c">Error B = [0, 0.25]</text><text x="486" y="310" font-size="18" fill="#18263c">Output MSE = 0.0625</text><text x="30" y="390" font-size="20" fill="#18263c">Both have weight MSE 0.03125. Inputs expose the difference.</text></g></svg>