<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title description"><title id="title">Measure a declared interval</title><desc id="description">An invented timeline distinguishes user and runtime time to first token from inter-token decode throughput.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#486687"/></marker></defs><rect width="900" height="410" fill="#f8fbff"/><g font-family="sans-serif"><text x="28" y="42" font-size="27" fill="#18263c">Measure a declared interval</text><line x1="55" y1="150" x2="850" y2="150" stroke="#486687" stroke-width="3" marker-end="url(#arrow)"/><line x1="70" y1="136" x2="70" y2="165" stroke="#244866" stroke-width="3"/><text x="30" y="95" font-size="20" fill="#18263c">request</text><text x="35" y="200" font-size="18" fill="#18263c">t0=0</text><line x1="250" y1="136" x2="250" y2="165" stroke="#244866" stroke-width="3"/><text x="210" y="95" font-size="20" fill="#18263c">submit</text><text x="215" y="200" font-size="18" fill="#18263c">ts=0.2</text><line x1="430" y1="136" x2="430" y2="165" stroke="#244866" stroke-width="3"/><text x="390" y="95" font-size="20" fill="#18263c">first token</text><text x="395" y="200" font-size="18" fill="#18263c">t1=0.7</text><line x1="810" y1="136" x2="810" y2="165" stroke="#244866" stroke-width="3"/><text x="770" y="95" font-size="20" fill="#18263c">last token</text><text x="775" y="200" font-size="18" fill="#18263c">tn=2.7</text><text x="35" y="265" font-size="23" fill="#18263c">User TTFT = 0.7 s; runtime TTFT = 0.5 s</text><text x="35" y="315" font-size="23" fill="#18263c">Five tokens create four intervals after the first token.</text><text x="35" y="365" font-size="23" fill="#18263c">Decode rate = (5 − 1) / (2.7 − 0.7) = 2 tokens/s</text></g></svg>