<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title description"><title id="title">Fix one error; optimize the remaining coordinate</title><desc id="description">For positive correlated channels, a negative second error reduces the constrained quadratic loss.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#486687"/></marker></defs><rect width="900" height="410" fill="#f8fbff"/><g font-family="sans-serif"><text x="28" y="42" font-size="27" fill="#18263c">Fix one error; optimize the remaining coordinate</text><rect x="30" y="100" width="400" height="110" rx="12" fill="#ffe7df" stroke="#7892b5"/><text x="46" y="134" font-size="21" fill="#18263c">Fixed e1 = +0.25</text><text x="46" y="165" font-size="18" fill="#18263c">No compensation: e2=0; L=0.25</text><rect x="470" y="100" width="400" height="110" rx="12" fill="#e0f5e9" stroke="#7892b5"/><text x="486" y="134" font-size="21" fill="#18263c">Choose e2 = −0.25</text><text x="486" y="165" font-size="18" fill="#18263c">Compensated loss L=0.125</text><text x="35" y="280" font-size="24" fill="#18263c">L = 4 e1² + 4 e1 e2 + 2 e2²</text><text x="35" y="330" font-size="24" fill="#18263c">∂L/∂e2 = 4 e1 + 4 e2 = 0 → e2 = −e1</text><text x="35" y="380" font-size="20" fill="#18263c">Later quantizing e2 can lose part of this continuous optimum.</text></g></svg>