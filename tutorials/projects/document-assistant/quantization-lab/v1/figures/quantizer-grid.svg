<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title description"><title id="title">Three-bit affine grid: eight possible reconstructions</title><desc id="description">Codes zero through seven reconstruct values from minus 1.714 to 4.286. Input seven clips to the largest code.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#486687"/></marker></defs><rect width="900" height="410" fill="#f8fbff"/><g font-family="sans-serif"><text x="28" y="42" font-size="27" fill="#18263c">Three-bit affine grid: eight possible reconstructions</text><line x1="70" y1="155" x2="835" y2="155" stroke="#486687" stroke-width="3" marker-end="url(#arrow)"/><circle cx="90" cy="155" r="7" fill="#386ab0"/><text x="78" y="120" font-size="20" fill="#18263c">0</text><text x="58" y="200" font-size="18" fill="#18263c">-1.71</text><circle cx="180" cy="155" r="7" fill="#386ab0"/><text x="168" y="120" font-size="20" fill="#18263c">1</text><text x="148" y="200" font-size="18" fill="#18263c">-0.86</text><circle cx="270" cy="155" r="7" fill="#386ab0"/><text x="258" y="120" font-size="20" fill="#18263c">2</text><text x="238" y="200" font-size="18" fill="#18263c">0.00</text><circle cx="360" cy="155" r="7" fill="#386ab0"/><text x="348" y="120" font-size="20" fill="#18263c">3</text><text x="328" y="200" font-size="18" fill="#18263c">0.86</text><circle cx="450" cy="155" r="7" fill="#386ab0"/><text x="438" y="120" font-size="20" fill="#18263c">4</text><text x="418" y="200" font-size="18" fill="#18263c">1.71</text><circle cx="540" cy="155" r="7" fill="#386ab0"/><text x="528" y="120" font-size="20" fill="#18263c">5</text><text x="508" y="200" font-size="18" fill="#18263c">2.57</text><circle cx="630" cy="155" r="7" fill="#386ab0"/><text x="618" y="120" font-size="20" fill="#18263c">6</text><text x="598" y="200" font-size="18" fill="#18263c">3.43</text><circle cx="720" cy="155" r="7" fill="#386ab0"/><text x="708" y="120" font-size="20" fill="#18263c">7</text><text x="688" y="200" font-size="18" fill="#18263c">4.29</text><text x="35" y="255" font-size="21" fill="#18263c">Code q (top) → reconstructed value (bottom)</text><text x="35" y="297" font-size="21" fill="#18263c">s = 6/7; z = 2; zero is exact, endpoints shift.</text><text x="35" y="343" font-size="21" fill="#18263c">Input 7 clips to q=7 → 4.286; its original magnitude is lost.</text></g></svg>